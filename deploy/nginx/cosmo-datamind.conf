# Copy into /etc/nginx/conf.d/ (or sites-enabled/) after adding your TLS/auth policy.
# Gunicorn stays loopback-only; Nginx is the only public listener.
# Set DATAMIND_PUBLIC_ORIGIN=http://datamind.example.com for this sample listener;
# after enabling TLS, change it to https://datamind.example.com (include a non-default port).
# This explicitly configures both the Host allowlist and browser-origin validation.
upstream cosmo_datamind {
    server 127.0.0.1:8092;
    keepalive 16;
}

server {
    listen 80;
    server_name datamind.example.com;

    # Match Flask's default DATAMIND_MAX_REQUEST_BYTES=25 MiB.
    client_max_body_size 25m;
    client_body_timeout 300s;
    client_header_timeout 15s;
    keepalive_timeout 15s;

    # Add auth here before exposing the service. TLS termination should be configured by the
    # deployment environment (certificate paths are intentionally not guessed in this template).
    location / {
        proxy_pass http://cosmo_datamind;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Four API endpoints stream SSE; buffering would hide incremental progress.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1900s;
        proxy_send_timeout 310s;
    }
}
