name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: datamind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单元 + 前端行为 + 覆盖率 + lint + 类型
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check.py --suite unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: .check-results/

  integration:
    name: 隔离 HTTP 与十轮变序回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check.py --suite integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: .check-results/

  browser:
    name: 桌面与窄屏浏览器验收
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check.py --suite ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: .check-results/
