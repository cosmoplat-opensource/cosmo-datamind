name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: datamind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单元 + 前端行为 + 覆盖率 + lint + 类型
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - id: checks
        run: python scripts/check.py --suite unit --report-dir "$RUNNER_TEMP/datamind-results"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: unit-results
          path: ${{ runner.temp }}/datamind-results/
          if-no-files-found: error

  integration:
    name: 隔离 HTTP 与十轮变序回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt
      - id: checks
        run: python scripts/check.py --suite integration --report-dir "$RUNNER_TEMP/datamind-results"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: integration-results
          path: ${{ runner.temp }}/datamind-results/
          if-no-files-found: error

  browser:
    name: 桌面与窄屏浏览器验收
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - id: checks
        run: python scripts/check.py --suite ui --report-dir "$RUNNER_TEMP/datamind-results"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: browser-results
          path: ${{ runner.temp }}/datamind-results/
          if-no-files-found: error
