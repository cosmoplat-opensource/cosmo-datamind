name: CI

# IR-007 工程校验:每次 push/PR 跑「单测+覆盖率+lint」。
# 集成套件使用仓库内 108 表验证库起服务；确定性失败必须阻止合并。
on:
  push:
  pull_request:

jobs:
  unit:
    name: 单测 + 覆盖率 + lint(确定性层)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: Lint(只抓真 bug:F+B)
        run: ruff check . --output-format=github
      - name: 类型检查
        run: mypy . --no-error-summary
      - name: 单测 + 覆盖率基线
        run: |
          coverage run -m pytest tests/ -q
          coverage report
      - name: 文档-代码计数自检
        run: pytest tests/meta -q

  integration:
    name: 集成套件(108 表验证库,强制)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装运行时依赖
        run: pip install -r requirements-dev.txt
      - name: 起服务并跑 test_all.py
        env:
          DATAMIND_DB: ${{ github.workspace }}/examples/demo_metrics.db
          DATAMIND_WORKDIR: ${{ github.workspace }}/workdir
        run: |
          test -f "$DATAMIND_DB"
          python3 server.py > /tmp/datamind-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8092/api/db/check >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8092/api/db/check >/dev/null || { cat /tmp/datamind-ci.log; exit 1; }
          python3 test_all.py
