name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: datamind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: 单元与前端行为（分组 ${{ matrix.shard }}）
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    outputs:
      count: ${{ steps.checks.outputs.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - id: checks
        env:
          SHARD: ${{ matrix.shard }}
          COUNT: ${{ strategy.job-total }}
          PYTHONHASHSEED: "0"
        run: |
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          python scripts/check.py --suite unit --unit-shard "$SHARD" "$COUNT" --report-dir "$RUNNER_TEMP/datamind-results"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: unit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/datamind-results/
          if-no-files-found: error

  unit:
    name: 单元 + 前端行为 + 覆盖率 + lint + 类型
    runs-on: ubuntu-24.04
    needs: unit_tests
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - if: needs.unit_tests.result != 'success'
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: unit-shard-*
          path: ${{ runner.temp }}/datamind-shards
      - id: checks
        shell: bash
        env:
          COUNT: ${{ needs.unit_tests.outputs.count }}
        run: |
          inputs=()
          for ((i=1; i<=COUNT; i++)); do
            inputs+=("$RUNNER_TEMP/datamind-shards/unit-shard-$i/coverage-data")
          done
          python scripts/check.py --suite unit --combine-unit "${inputs[@]}" --report-dir "$RUNNER_TEMP/datamind-results"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: unit-results
          path: ${{ runner.temp }}/datamind-results/
          if-no-files-found: error

  integration:
    name: 隔离 HTTP 与十轮变序回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt
      - id: checks
        run: python scripts/check.py --suite integration --report-dir "$RUNNER_TEMP/datamind-results"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: integration-results
          path: ${{ runner.temp }}/datamind-results/
          if-no-files-found: error

  browser:
    name: 桌面与窄屏浏览器验收
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.2
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - id: checks
        run: python scripts/check.py --suite ui --report-dir "$RUNNER_TEMP/datamind-results"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: browser-results
          path: ${{ runner.temp }}/datamind-results/
          if-no-files-found: error
