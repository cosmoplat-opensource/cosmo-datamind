# COSMO DataMind · 工程校验与 TDD 基础设施(IR-007 / DR-045)
# 单一事实源:lint / 类型 / 测试发现 / 覆盖率 都在此声明,合并即挡。
[project]
name = "cosmo-datamind"
version = "0.1.0"
description = "数据治理 × 工业本体 × 深度问数 一体化原型"
requires-python = ">=3.10"

[tool.pytest.ini_options]
# pythonpath="." 让 tests/ 能 import 根目录的确定性模块(health_check 等)。
# 默认只收 tests/ 下的单测/元测试;test_all.py/test_ui*.py 是需起服务的集成套件,
# 由 CI 的独立 job 跑(见 .github/workflows/ci.yml),不进 pytest 默认发现。
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
  "integration: 需要本地起服务(8092)的端到端测试,默认单测轮不跑",
]

[tool.coverage.run]
branch = true
# 全部生产模块都计入覆盖率(DR-106);路由层与确定性模块分别设下限,见下方 report 一节与 scripts/check.py。
source = [
  "health_check", "cq_check", "drift_check", "rule_engine", "module_split",
  "compat_check", "intent_check", "usage_stat", "quick_build", "openai_runtime",
  "dao_core", "hallucination_eval", "definition_eval", "store", "srv_context", "srv_hardening",
  "ir_relational", "skill_registry", "build_quality", "ontology_grounding", "action_ontology",
  "ir_shape", "content_quality", "mcp_action_server", "mcp_build_server",
  "build_references", "standard_assets",
  "data_catalog", "workload_concepts", "declared_fk",
  "metric_contract", "metric_mining", "metric_pipeline", "concept_profile", "osi_export",
  "key_links", "relation_triage", "database_scope", "translate_cn",
  "server", "bp_actions", "bp_engine", "bp_metrics", "bp_semantic", "srv_actions", "srv_engine",
  "ath_adapter", "sqlite_evidence", "llm_json", "doc_chunks", "build_prep", "ext_sample", "build_cleaning", "concept_hints", "code_contracts", "ontology_domain", "observability",
]
omit = ["tests/*", "ath_adapter/e2e/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 三道下限(DR-106),scripts/check.py 逐一检查,只升不降:
#   全部模块(本项)        当前 75.3%
#   确定性模块(不含路由层) 当前 88.6%,下限 87
#   路由层(server.py、bp_*、srv_engine、srv_actions) 当前 62.8%,下限 61
# 此前路由层整个不在统计内,9000 行的 server.py 没有任何覆盖率下限。
fail_under = 74.0
precision = 1

[tool.ruff]
line-length = 120
target-version = "py310"
# 本代码库刻意采用紧凑单行风格(`if x: return y`),E7xx/E4xx 与之冲突且非缺陷——
# 校验只保留「抓真 bug」的规则:F(pyflakes,含重复字典键 F601)、B(bugbear,含闭包捕获 B023)。
# 风格类留待人工酌情,不进 CI 硬校验,避免上万行噪声 diff 淹没真问题。
[tool.ruff.lint]
select = ["F", "B"]
ignore = [
  "B008",   # 函数默认值中调用(Flask 惯用),非本库缺陷
  "B905",   # zip strict=(py310 起可用,渐进采用)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# 这三份文件是顺序执行、共享大量临时变量的端到端探针，不是可导入模块；
# 由 ruff 与实际运行校验。mypy 聚焦生产模块及 tests/ 中的模块化测试。
exclude = ["^test_all\\.py$", "^test_ui\\.py$", "^test_ui_ops\\.py$", "^data/"]  # data/ 为本机分析物料(已被本机忽略),不属于仓库
# 原型渐进式类型化:先不强制注解,只抓明确的类型错误。
check_untyped_defs = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
# 逐模块开启函数体检查(DR-106)。全仓默认不检查无注解函数的函数体,此前 920 个函数里只有 8 个带注解,
# 类型检查实际只看模块顶层。下列模块在开启后无错误,新增模块应加入此表;server.py 等仍有存量错误,暂不在内。
module = [
    "dao_core", "srv_context", "sqlite_evidence", "ir_shape", "ir_relational", "store", "ontology_domain",
    "database_scope", "relation_triage", "key_links", "code_contracts", "compat_check", "content_quality",
    "definition_eval", "hallucination_eval", "intent_check", "observability", "ontology_grounding",
    "openai_runtime", "skill_registry", "action_ontology", "mcp_action_server", "metric_pipeline",
    "srv_actions", "srv_engine", "bp_actions", "bp_engine", "bp_metrics", "bp_semantic", "wsgi",
    "ath_adapter.provider", "cq_check", "data_catalog", "drift_check", "metric_mining", "module_split",
    "translate_cn", "llm_json", "rule_engine", "concept_profile", "usage_stat",
]
check_untyped_defs = true

[[tool.mypy.overrides]]
# 演示库生成脚本(仿真与事件推导)大量使用逐行累积的临时列表/字典,按渐进式类型化不强制局部变量注解;
# 其余类型错误照常检查
module = [
    "scripts.demo108_master",
    "scripts.demo108_sim",
    "scripts.demo108_rest",
    "scripts.demo108_dws",
    "scripts.demo108_meta",
    "scripts.demo108_checks",
    "scripts.build_demo_108_db",
    "scripts.contract_200_events",
    "scripts.contract_200_values",
    "scripts.contract_200_semantics",
    "scripts.contract_200_checks",
    "scripts.contract_200_metadata",
    "scripts.build_contract_200_db",
]
disable_error_code = ["var-annotated"]
