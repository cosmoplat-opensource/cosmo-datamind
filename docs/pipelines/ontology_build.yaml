# 本体半自动构建链路 · 显式编排说明(DR-050/052)
#
# 本文件不参与运行，用于说明 /api/build/inquire 的实际执行顺序、阻断条件和降级路径。
# code 锚点由 tests/meta/test_ontology_pipeline_doc.py 回打源码,防止说明与实现悄悄漂移。

name: ontology_semi_automatic_build
description: 范围/CQ → 行业/标准参照 → 来源整理 → 技能方法 → LLM 提议 → 语义复核 → 数据验证 → 参照注释 → 指标反解与核验 → 验收 → 人工复核
entrypoint: server.py:build_inquire
version: "2.4"

principles:
  - 验收结果采用 pass/review/fail 三态
  - LLM 只提议对象、关系和候选键,不得自评 verified
  - verified 只来自通过引用完整性检查的声明外键或可回放的完整值域裁决证据
  - 语义复核结果只触发人工复核，不覆盖可重复的数据验证结果
  - candidate/gap 保留失败证据,不静默删除
  - CQ 是构建输入与构建后验收;未提供时覆盖率为空而不是零或伪造值
  - 行业/标准可不选;参照缺口待审、强约束缺口阻断,均不得为通过模板而编造证据
  - 标准机器可读资产固定版本本地加载;不跟随 RDF/XSD import 联网,缺失时不得伪装就绪
  - 指标与关系同等:verified 只来自「可编译 ∧ 只读执行成功 ∧ 与参照一致」,certified 只能由人授予

nodes:
  - id: intake_scope_and_cq
    type: deterministic
    code: "server.py:_normalize_build_cqs / build_inquire"
    desc: 归一构建目标、数据源、技能与能力问题;限制 CQ 数量和长度

  - id: skill_discovery
    type: deterministic
    code: "skill_registry.py:discover / method_text"
    desc: 合并本仓内置技能与可选上游技能;列表、查看、prompt 注入共用同一注册表

  - id: reference_profile
    type: deterministic
    code: "build_references.py:normalize / prompt_block"
    desc: 归一行业/本体标准及参照/强约束模式;旧调用兼容 BFO/IOF,显式 none 不施加标准

  - id: reference_asset_load
    type: deterministic
    code: "standard_assets.py:status / prompt_context / trace"
    desc: 离线解析本地 RDF/XSD,核验文件、许可来源和内容指纹;资产缺失进入参照质量门

  - id: evidence_manifest
    type: deterministic
    code: "server.py:_gather_evidence"
    desc: 聚合真实表列、代码/文档摘录和未解析资产引用;所有引用留来源

  - id: proposal
    type: llm
    code: "server.py:_llm_extract_ontology"
    desc: 生成对象/事件/关系/定义与可选候选键;候选键只调整验证顺序
    on_fail: quick_build_fallback

  - id: stability_probe
    type: optional_observer
    code: "server.py:_stability_annotate"
    desc: 二次独立提议计算 Jaccard;仅暴露模型方差,不作 verified 否决权

  - id: semantic_review
    type: llm_observer
    code: "server.py:_llm_semantic_review"
    desc: 从 schema 复审共享值域/同名巧合;pass/fail/skipped 都如实留痕

  - id: data_adjudication
    type: deterministic_check
    code: "server.py:_adjudicate_ir"
    desc: 验证真实候选列,在只读快照中计算完整 distinct 统计与唯一性,保存最佳尝试证据;60秒预算

  - id: complete_sql_evidence
    type: deterministic_check
    code: "sqlite_evidence.py:relation_signals"
    desc: 单列和复合元组完整集合的交集/去重/总行数在SQL内聚合,不以截断前缀证明verified

  - id: adjudication_core
    type: deterministic_check
    code: "dao_core.py:overlap_pct / name_ok / should_reverse / classify"
    desc: 固定阈值 + 父键唯一 + 命名/父表证据 + 方向反证;复合键按元组联合裁决

  - id: quick_build_fallback
    type: deterministic_fallback
    code: "quick_build.py:build"
    desc: LLM 离线时从 schema/数据发现关系;与 LLM 分支共用 dao_core 和验收检查

  - id: upper_relation_grounding
    type: deterministic_check
    code: "ontology_grounding.py:normalize / from_verb"
    desc: 仅映射官方 BFO/IOF 关系，并检查源、目标上层类别；无法确认时保留本地对象属性

  - id: reference_annotation
    type: deterministic_check
    code: "build_references.py:apply_profile / evaluate"
    desc: 对整图应用行业/标准候选注释;行业核心项与标准对齐缺口按模式进入待审或阻断

  - id: metric_mining
    type: deterministic
    code: "metric_pipeline.py:run / metric_mining.py:collect"
    desc: 指标反解:上传 SQL / 口径表 / 沉淀 SQL / 参考基准 → 带来源的候选;含 JOIN 不猜口径

  - id: metric_adjudication
    type: deterministic_check
    code: "metric_contract.py:schema_missing / compile_sql / adjudicate"
    desc: 同一只读快照内目录核对 → 确定性编译 → 执行主SQL与参照SQL并比对;verified 只来自可执行且一致,人工状态不覆盖

  - id: quality_health
    type: deterministic_check
    code: "health_check.py:check"
    desc: 检查悬空端点、自反误判、冲突;孤岛/枢纽等只进 review

  - id: quality_evidence
    type: deterministic_check
    code: "build_quality.py:audit_verified_evidence"
    desc: verified 必须携带连接键、阈值、父键唯一、命名证据与正确方向

  - id: quality_metric
    type: deterministic_check
    code: "metric_contract.py:audit / counts"
    desc: verified 指标须带编译 SQL、执行成功、参照一致;certified 须有确认人;candidate 指标进待审

  - id: quality_definition
    type: deterministic_check
    code: "definition_eval.py:score_ontology"
    desc: 检查非循环、属加种差和反例;不足进入下一轮缺口

  - id: quality_cq
    type: deterministic_check
    code: "cq_check.py:check_all"
    desc: 有 CQ 时核验已验证关系路径的可达性;partial/unanswerable 形成待补项

  - id: quality_aggregate
    type: deterministic_check
    code: "build_quality.py:evaluate"
    desc: 聚合 pass/review/fail;只诊断不自动修图

  - id: persist_audit
    type: output
    code: "srv_context.py:_atomic_json"
    desc: IR、逐关系证据、references、标准资产指纹、quality 报告、gaps 与逐轮历史一起原子落盘

  - id: human_review_feedback
    type: human
    code: "server.py:ont_review / _stamp_review / _rejected_patterns"
    desc: 人工确认只产生 asserted；否决模式用于下一轮候选抑制

edges:
  - [intake_scope_and_cq, reference_profile]
  - [reference_profile, reference_asset_load]
  - [reference_asset_load, skill_discovery]
  - [skill_discovery, evidence_manifest]
  - [evidence_manifest, proposal]
  - [proposal, semantic_review]
  - [proposal, stability_probe]
  - [proposal, data_adjudication]
  - [data_adjudication, adjudication_core]
  - [data_adjudication, complete_sql_evidence]
  - [quick_build_fallback, complete_sql_evidence]
  - [complete_sql_evidence, adjudication_core]
  - [proposal, quick_build_fallback]
  - [adjudication_core, upper_relation_grounding]
  - [quick_build_fallback, upper_relation_grounding]
  - [upper_relation_grounding, reference_annotation]
  - [reference_annotation, metric_mining]
  - [metric_mining, metric_adjudication]
  - [metric_adjudication, quality_health]
  - [quality_health, quality_evidence]
  - [quality_evidence, quality_metric]
  - [quality_metric, quality_definition]
  - [quality_definition, quality_cq]
  - [quality_cq, quality_aggregate]
  - [quality_aggregate, persist_audit]
  - [persist_audit, human_review_feedback]

result_semantics:
  pass: 无阻断问题、无待审项且 CQ 已通过
  review: 候选关系、语义争议、定义不足、CQ 未提供/未完全支撑或软参照存在缺口
  fail: 图结构不自洽、verified 证据契约被破坏或强约束存在缺口
